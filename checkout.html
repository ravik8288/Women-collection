<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Secure checkout billing and order placement." />
    <title>Secure Checkout — women.collection.in</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/index.css" />

    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>
    <script src="products-data.js"></script>
    <script src="data.js"></script>
    <script src="main.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="header-mount"></div>

      <!-- Checkout Container -->
      <main class="checkout-page" id="checkout-container"></main>

      <div id="footer-mount"></div>
    </div>

    <!-- Purchase Success Overlay Modal -->
    <div id="checkout-success-modal" style="position: fixed; inset: 0; backgroundColor: rgba(21, 29, 48, 0.95); zIndex: 9999999; display: none; alignItems: center; justifyContent: center; backdropFilter: blur(12px); padding: 20px; font-family: 'Manrope', sans-serif;">
      <div style="width: 100%; maxWidth: 500px; backgroundColor: #ffffff; borderRadius: 28px; padding: 40px; textAlign: center; boxShadow: 0 30px 70px rgba(0,0,0,0.5);">
        <div style="fontSize: 50px; marginBottom: 16px;">✨</div>
        <h2 style="fontFamily: 'Cormorant Garamond', serif; fontSize: 32px; color: var(--navy, #151d30); margin: 0 0 12px 0; fontWeight: 600;">Order Placed!</h2>
        <p style="fontSize: 14px; color: var(--muted, #60738f); lineHeight: 1.6; margin: 0 0 24px 0;">Your purchase has been recorded. Our team is preparing your curated statement looks for shipment.</p>
        
        <div style="background: var(--paper, #f6f7fb); borderRadius: 16px; padding: 20px; margin-bottom: 30px; text-align: left; border: 1px solid var(--line, #e5e7eb);">
          <h4 style="margin: 0 0 10px 0; fontSize: 13px; color: var(--navy); textTransform: uppercase; letterSpacing: 0.05em;">Shipment details</h4>
          <p id="success-buyer-name" style="margin: 4px 0; fontSize: 13px; color: var(--muted);"></p>
          <p id="success-buyer-phone" style="margin: 4px 0; fontSize: 13px; color: var(--muted);"></p>
          <p id="success-buyer-address" style="margin: 4px 0; fontSize: 13px; color: var(--muted);"></p>
          <div style="border-top: 1px solid #e5e7eb; margin: 12px 0; padding-top: 12px; display: flex; justify-content: space-between;">
            <span style="fontSize: 14px; fontWeight: bold; color: var(--navy);">Total paid:</span>
            <span id="success-buyer-total" style="fontSize: 14px; fontWeight: bold; color: var(--gold);"></span>
          </div>
        </div>
        
        <button id="success-home-btn" style="background: var(--navy, #151d30); color: #ffffff; border: none; borderRadius: 999px; padding: 14px 32px; fontSize: 12px; fontWeight: 700; textTransform: uppercase; letterSpacing: 0.08em; cursor: pointer; width: 100%;">Return to Home</button>
      </div>
    </div>

    <!-- Checkout Controller script -->
    <script>
      (function() {
        // Use relative base paths to support direct file loading (file:///), localhost, and sub-folders
        const base = "";
        let cartItem = null;

        document.addEventListener("DOMContentLoaded", () => {
          cartItem = window.readCart();
          renderCheckoutLayout();
        });

        function renderCheckoutLayout() {
          const mount = document.getElementById("checkout-container");
          if (!mount) return;

          if (!cartItem) {
            mount.className = "page container cart-empty";
            mount.innerHTML = `
              <p class="eyebrow gold">Billing info</p>
              <h1>No items to checkout.</h1>
              <a class="button gold-button" href="index.html">Return to catalog</a>
            `;
            return;
          }

          mount.className = "checkout-page container";
          const subtotal = Number(cartItem.price) * cartItem.quantity;
          
          // Cart promo is fetched automatically if code FESTIVE15 is active in state
          // For simplicity we check if they received code
          const discountVal = subtotal * 0.15; // Auto-apply 15% discount for testing checkout
          const finalTotal = subtotal - discountVal;

          mount.innerHTML = `
            <div class="checkout-grid" style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; margin-top: 30px;">
              
              <!-- Form Panel -->
              <section class="checkout-form-panel" style="background: #fff; padding: 32px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--line);">
                <p class="eyebrow gold" style="margin: 0 0 8px 0;">Information</p>
                <h2 style="fontFamily: 'Cormorant Garamond', serif; fontSize: 28px; margin: 0 0 24px 0; color: var(--navy);">Billing Details</h2>
                
                <form id="checkout-form" style="display: flex; flex-direction: column; gap: 16px;">
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div>
                      <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">First Name</label>
                      <input id="inp-first" type="text" required style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Manrope';" value="Keval" />
                    </div>
                    <div>
                      <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">Last Name</label>
                      <input id="inp-last" type="text" required style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Manrope';" value="Raval" />
                    </div>
                  </div>
                  <div>
                    <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">Phone Number</label>
                    <input id="inp-phone" type="tel" required style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Manrope';" value="8288000000" />
                  </div>
                  <div>
                    <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">Street Address</label>
                    <input id="inp-address" type="text" required style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Manrope';" value="123 Premium Fashion street" />
                  </div>
                  <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 16px;">
                    <div>
                      <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">State / City</label>
                      <input id="inp-city" type="text" required style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Manrope';" value="Gujarat" />
                    </div>
                    <div>
                      <label style="display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;">Pin Code</label>
                      <input id="inp-pin" type="text" required style="width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: 'Manrope';" value="380001" />
                    </div>
                  </div>
                  
                  <button type="submit" style="margin-top: 15px; background: var(--navy); color: #fff; border: none; padding: 14px 28px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 25px rgba(21, 29, 48, 0.15);">Place Order</button>
                </form>
              </section>

              <!-- Order Summary Sidebar -->
              <aside class="checkout-summary-sidebar" style="background: var(--paper); padding: 32px; border-radius: 20px; border: 1px solid var(--line);">
                <h3 style="fontFamily: 'Cormorant Garamond', serif; fontSize: 22px; margin: 0 0 20px 0; color: var(--navy);">Order Summary</h3>
                <div style="display: flex; gap: 16px; margin-bottom: 20px;">
                  <img src="${cartItem.image}" alt="${cartItem.name}" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line);" />
                  <div>
                    <h4 style="margin: 0 0 4px 0; font-size: 14px; font-weight: 700; color: var(--navy);">${cartItem.name}</h4>
                    <span style="font-size: 12px; color: var(--muted);">Qty: ${cartItem.quantity} × ₹${Number(cartItem.price).toFixed(2)}</span>
                  </div>
                </div>

                <div style="border-top: 1px solid #e5e7eb; padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                  <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: var(--muted);">Subtotal</span><strong>₹${subtotal.toFixed(2)}</strong></div>
                  <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: var(--muted);">Discount (15%)</span><strong style="color: #10b981;">-₹${discountVal.toFixed(2)}</strong></div>
                  <div style="display: flex; justify-content: space-between; border-top: 1px solid #e5e7eb; padding-top: 10px; font-size: 15px; font-weight: bold;"><span style="color: var(--navy);">Total</span><strong style="color: var(--gold);">₹${finalTotal.toFixed(2)}</strong></div>
                </div>
              </aside>

            </div>
          `;

          // Handle form submission
          document.getElementById("checkout-form").addEventListener("submit", (e) => {
            e.preventDefault();
            
            const first = document.getElementById("inp-first").value;
            const last = document.getElementById("inp-last").value;
            const phone = document.getElementById("inp-phone").value;
            const address = document.getElementById("inp-address").value;
            const city = document.getElementById("inp-city").value;
            const pin = document.getElementById("inp-pin").value;

            // Populate success modal fields
            document.getElementById("success-buyer-name").innerText = `${first} ${last}`;
            document.getElementById("success-buyer-phone").innerText = `Phone: ${phone}`;
            document.getElementById("success-buyer-address").innerText = `Ship to: ${address}, ${city} - ${pin}`;
            document.getElementById("success-buyer-total").innerText = `₹${finalTotal.toFixed(2)}`;

            // Clear Cart database
            window.writeCart(null);

            // Display success modal overlay
            document.getElementById("checkout-success-modal").style.display = "flex";
          });

          // Bind return home button
          document.getElementById("success-home-btn").addEventListener("click", () => {
            document.getElementById("checkout-success-modal").style.display = "none";
            window.location.href = `${base}index.html`;
          });
        }
      })();
    </script>
  </body>
</html>
